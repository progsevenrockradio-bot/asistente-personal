<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sin Conexión - Mi Asistente Personal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #020617;
            color: #f8fafc;
            text-align: center;
            padding: 1.5rem;
        }
        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }
        p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin: 0 0 1.5rem 0;
            line-height: 1.5;
        }
        button {
            background: linear-gradient(to right, #4f46e5, #0284c7);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h1>Modo Sin Conexión</h1>
        <p>No tienes acceso a internet en este momento. Tus datos previamente cargados están protegidos. Comprueba tu conexión para sincronizar.</p>
        <button onclick="window.location.reload()">Reintentar conexión</button>
    </div>
</body>
</html>
